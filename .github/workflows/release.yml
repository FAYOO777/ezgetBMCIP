name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $number = $tag.TrimStart("v")
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "number=$number" >> $env:GITHUB_OUTPUT

      - name: Clean publish output
        shell: pwsh
        run: |
          Remove-Item publish -Recurse -Force -ErrorAction SilentlyContinue

      # ── Full (self-contained) ─────────────────────────────────────

      - name: Build + Publish Full
        run: >
          dotnet publish -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.release_version.outputs.number }}
          -p:InformationalVersion=${{ steps.release_version.outputs.tag }}
          -o publish/full

      # ── Lite (framework-dependent) ───────────────────────────────

      - name: Build + Publish Lite
        run: >
          dotnet publish -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:EnableCompressionInSingleFile=false
          -p:Version=${{ steps.release_version.outputs.number }}
          -p:InformationalVersion=${{ steps.release_version.outputs.tag }}
          -o publish/lite

      # ── Legacy (.NET Framework 4.6) ─────────────────────────────

      - name: Build + Publish Legacy
        run: >
          dotnet publish ezgetBMCIP.Legacy/ezgetBMCIP.Legacy.csproj -c Release
          -p:Version=${{ steps.release_version.outputs.number }}
          -p:InformationalVersion=${{ steps.release_version.outputs.tag }}
          -o publish/ezgetBMCIP-legacy-net46

      - name: Rename artifacts
        shell: pwsh
        run: |
          $unexpectedLiteFiles = Get-ChildItem publish/lite -File | Where-Object {
            $_.Name -notin @("ezgetBMCIP.exe", "ezgetBMCIP.pdb")
          }
          if ($unexpectedLiteFiles.Count -gt 0) {
            $names = ($unexpectedLiteFiles | ForEach-Object Name) -join ", "
            throw "Lite publish is not a single-file app. Unexpected files: $names"
          }

          $liteText = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("publish/lite/ezgetBMCIP.exe"))
          if ($liteText.Contains('"includedFrameworks"')) {
            throw "Lite publish contains includedFrameworks. Clean/rebuild without reusing self-contained build output."
          }
          if (-not $liteText.Contains('"frameworks"')) {
            throw "Lite publish does not contain framework-dependent runtime config."
          }

          Copy-Item publish/full/ezgetBMCIP.exe publish/ezgetBMCIP-full.exe
          Copy-Item publish/lite/ezgetBMCIP.exe publish/ezgetBMCIP-lite.exe
          Remove-Item publish/ezgetBMCIP-legacy-net46/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/ezgetBMCIP-legacy-net46/* -DestinationPath publish/ezgetBMCIP-legacy-net46.zip -Force

          $liteSize = (Get-Item publish/ezgetBMCIP-lite.exe).Length
          if ($liteSize -lt 1000000) {
            throw "Lite exe is too small ($liteSize bytes). It is probably an apphost without bundled assemblies."
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            publish/ezgetBMCIP-full.exe
            publish/ezgetBMCIP-lite.exe
            publish/ezgetBMCIP-legacy-net46.zip
          body_path: CHANGELOG.md

      # ── R2 upload ────────────────────────────────────────────────

      - name: Configure AWS CLI
        shell: pwsh
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region auto

      - name: Get file sizes
        id: sizes
        shell: pwsh
        run: |
          $fullSize = (Get-Item publish/ezgetBMCIP-full.exe).Length
          $liteSize = (Get-Item publish/ezgetBMCIP-lite.exe).Length
          $legacySize = (Get-Item publish/ezgetBMCIP-legacy-net46.zip).Length
          echo "full_size=$fullSize" >> $env:GITHUB_OUTPUT
          echo "lite_size=$liteSize" >> $env:GITHUB_OUTPUT
          echo "legacy_size=$legacySize" >> $env:GITHUB_OUTPUT

      - name: Download existing versions.json from R2
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp "s3://$env:R2_BUCKET_NAME/versions.json" versions.json --endpoint-url $endpoint 2>$null
          if (-not (Test-Path versions.json)) {
            '[]' | Out-File -Encoding utf8 versions.json
          }
          exit 0

      - name: Update versions.json
        shell: pwsh
        env:
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $date = (Get-Date -Format "yyyy-MM-dd")
          $prerelease = "${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}" -eq "true"
          $fullSize = ${{ steps.sizes.outputs.full_size }}
          $liteSize = ${{ steps.sizes.outputs.lite_size }}
          $legacySize = ${{ steps.sizes.outputs.legacy_size }}
          $domain = $env:R2_PUBLIC_DOMAIN

          $entry = [PSCustomObject]@{
            version = $tag
            date = $date
            prerelease = $prerelease
            assets = @(
              @{
                name = "ezgetBMCIP-full.exe"
                url = "https://$domain/$tag/ezgetBMCIP-full.exe"
                size = [long]$fullSize
                desc = "完整打包，开箱即用，无需额外环境"
              },
              @{
                name = "ezgetBMCIP-lite.exe"
                url = "https://$domain/$tag/ezgetBMCIP-lite.exe"
                size = [long]$liteSize
                desc = "体积小，下载快，需要系统装有 .NET Desktop Runtime 8.0"
              },
              @{
                name = "ezgetBMCIP-legacy-net46.zip"
                url = "https://$domain/$tag/ezgetBMCIP-legacy-net46.zip"
                size = [long]$legacySize
                desc = "兼容 Windows 7 SP1 / Windows 8 / Windows 8.1，需要 .NET Framework 4.6，解压后运行"
              }
            )
          }

          $versions = Get-Content versions.json -Raw | ConvertFrom-Json
          $list = [System.Collections.ArrayList]@($versions)
          for ($i = $list.Count - 1; $i -ge 0; $i--) {
            if ($list[$i].version -eq $tag) {
              $list.RemoveAt($i)
            }
          }
          $list.Insert(0, $entry)
          ConvertTo-Json -InputObject $list -Depth 4 | Out-File -Encoding utf8 versions.json
          Write-Host "Updated versions.json: $tag (entries: $($list.Count))"

      - name: Upload exe files to R2
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          $tag = "${{ github.ref_name }}"
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp publish/ezgetBMCIP-full.exe "s3://$env:R2_BUCKET_NAME/$tag/ezgetBMCIP-full.exe" --endpoint-url $endpoint
          aws s3 cp publish/ezgetBMCIP-lite.exe "s3://$env:R2_BUCKET_NAME/$tag/ezgetBMCIP-lite.exe" --endpoint-url $endpoint
          aws s3 cp publish/ezgetBMCIP-legacy-net46.zip "s3://$env:R2_BUCKET_NAME/$tag/ezgetBMCIP-legacy-net46.zip" --endpoint-url $endpoint
          Write-Host "Uploaded to R2 /$tag/"

      - name: Upload versions.json to R2
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp versions.json "s3://$env:R2_BUCKET_NAME/versions.json" --endpoint-url $endpoint --content-type "application/json"
          Write-Host "Uploaded versions.json"
