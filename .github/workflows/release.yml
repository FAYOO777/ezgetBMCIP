name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish Full (self-contained)
        run: >
          dotnet publish -c Release -r win-x64 --no-build
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/full

      - name: Publish Lite (framework-dependent)
        run: >
          dotnet publish -c Release -r win-x64 --no-build
          -p:PublishSingleFile=true
          -p:SelfContained=false
          -p:PublishReadyToRun=false
          -p:EnableCompressionInSingleFile=false
          -o publish/lite

      - name: Rename artifacts
        shell: pwsh
        run: |
          Copy-Item publish/full/ezgetBMCIP.exe publish/ezgetBMCIP-full.exe
          Copy-Item publish/lite/ezgetBMCIP.exe publish/ezgetBMCIP-lite.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            publish/ezgetBMCIP-full.exe
            publish/ezgetBMCIP-lite.exe
          generate_release_notes: true
